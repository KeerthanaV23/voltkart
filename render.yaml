services:
  - type: web
    name: voltkart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
